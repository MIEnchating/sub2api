name: Account proxy retirement

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/account-request-proxy.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: migration_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify migration preserves historical data and pins a single route
        working-directory: backend
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:migration_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: go test -tags=integration ./migrations -run '^TestRetireVIPCreditAndAccountMultiProxy$' -count=1
      - name: Verify fixed-proxy compatibility and rejection of retired settings
        working-directory: backend
        run: >-
          go test ./internal/service ./internal/repository ./internal/handler/admin
          -run '^(TestFixedProxyKeepsAccountSlotAcquisition|TestRetiredProxyConfigurationCannotScheduleWithoutReview|TestRetiredRequestProxyConfigurationCannotBeSaved|TestAccountRepositoryRejectsRetiredProxyPoolBeforeWriting|TestOpenAIAdminSingleProxyAuthorizationKeepsCompatibility|TestOpenAIAdminRequestProxyAuthorizationRejectsInvalidSettings)$'
          -count=1
