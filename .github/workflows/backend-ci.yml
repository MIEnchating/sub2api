name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Set up GNU coreutils for Linux automation checks
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
      - name: Check upstream feature exclusions
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          python3 .github/check-upstream-exclusions.py .
          python3 -m unittest discover -s .github -p 'test_upstream*.py'
          /bin/bash -n scripts/upstream-sync.sh
          /bin/bash -n scripts/upstream-sync-validation.sh
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: sub2api_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d sub2api_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          required="$(awk '$1 == "go" { print $2 }' backend/go.mod)"
          test "$(GOTOOLCHAIN=local go env GOVERSION)" = "go${required}"
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:integration-test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/sub2api_test?sslmode=disable
          QQBOT_TEST_DSN: postgres://postgres:integration-test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/sub2api_test?sslmode=disable
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          required="$(awk '$1 == "go" { print $2 }' backend/go.mod)"
          test "$(GOTOOLCHAIN=local go env GOVERSION)" = "go${required}"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_*.py'
      - run: bash -n .github/release-tools/release-images.sh
