name: Build CPA account capacity plugin

on:
  push:
    paths:
      - "cpa-plugin-account-capacity/**"
      - ".github/workflows/account-capacity-plugin.yml"
  pull_request:
    paths:
      - "cpa-plugin-account-capacity/**"
      - ".github/workflows/account-capacity-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpa-plugin-account-capacity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cpa-plugin-account-capacity/go.mod
          cache-dependency-path: cpa-plugin-account-capacity/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build Linux amd64 plugin
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -trimpath -o account-capacity.so .
          rm -f account-capacity.h

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: account-capacity-linux-amd64
          path: cpa-plugin-account-capacity/account-capacity.so
