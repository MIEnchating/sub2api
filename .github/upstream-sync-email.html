<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{PROJECT}} · {{REPORT_NAME}}</title>
<style>
body{margin:0;padding:0;-webkit-text-size-adjust:100%}
table{mso-table-lspace:0pt;mso-table-rspace:0pt}
td,p,div{overflow-wrap:anywhere;word-wrap:break-word}
@media only screen and (max-width:600px){
.outer{padding:12px 8px!important}.section{padding-left:18px!important;padding-right:18px!important}
.card{display:block!important;width:auto!important;padding:0 0 8px!important}
.report-title{font-size:25px!important;line-height:34px!important}
.meta-label{width:86px!important;padding-right:10px!important}
}
</style>
</head>
<body style="margin:0;padding:0;background:#eef2f6;color:#25364a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{PREHEADER}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;table-layout:fixed;background:#eef2f6;">
<tr><td class="outer" align="center" style="padding:32px 12px;">
<!--[if mso]><table role="presentation" width="720" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:720px;table-layout:fixed;background:#ffffff;border:1px solid #dce4ee;border-radius:12px;overflow:hidden;">
<tr><td class="section" style="padding:22px 30px;background:#172b4d;color:#ffffff;">
<div style="font-size:20px;line-height:28px;font-weight:700;">{{PROJECT}} <span style="font-size:12px;font-weight:400;color:#c2d0e5;">/ 自动同步</span></div>
<div style="margin-top:4px;font-size:12px;line-height:20px;color:#c2d0e5;">{{REPORT_NAME}}</div>
</td></tr>
{{PREVIEW}}
<tr><td class="section" style="padding:26px 30px 22px;">
<span style="display:inline-block;padding:5px 10px;border-radius:5px;background:{{SOFT}};color:{{COLOR}};font-size:12px;line-height:20px;font-weight:700;">{{STATUS}}</span>
<h1 class="report-title" style="margin:12px 0 6px;font-size:28px;line-height:38px;color:#172b4d;font-weight:700;">{{TITLE}}</h1>
<p style="margin:0 0 16px;font-size:13px;line-height:22px;color:#58697e;">{{SUBTITLE}}</p>
<div style="padding:13px 16px;border-left:3px solid {{COLOR}};background:{{SOFT}};font-size:14px;line-height:25px;word-break:break-word;overflow-wrap:anywhere;">{{SUMMARY}}</div>
</td></tr>
<tr><td class="section" style="padding:0 26px 20px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;table-layout:fixed;">{{CARDS}}</table></td></tr>
{{CONTENT}}
<tr><td class="section" style="padding:20px 30px;background:#f8fafc;border-top:1px solid #e4eaf2;">
<div style="font-size:12px;line-height:20px;font-weight:600;color:#475569;">完整日志 · 服务器本地路径</div>
<div style="margin-top:5px;font-family:Consolas,monospace;font-size:11px;line-height:19px;color:#58697e;word-break:break-all;overflow-wrap:anywhere;">{{LOG}}</div>
<div style="margin-top:12px;font-size:12px;line-height:20px;color:#58697e;">{{FOOTER}}</div>
<div style="margin-top:8px;font-size:11px;line-height:18px;color:#64748b;">由 Linux 定时同步任务自动生成 · 执行时间以北京时间为准</div>
</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body></html>
