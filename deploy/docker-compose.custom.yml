# sub2api-custom source-build overlay.
# Use together with docker-compose.local.yml for a new generic deployment.
# Existing deployments can apply this overlay without changing their data volumes.

services:
  sub2api:
    image: sub2api-custom:local
    container_name: sub2api-custom
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Source builds read the tracked FORK_VERSION.
        VERSION: ""
        COMMIT: ${BUILD_COMMIT:-local}
        BUILD_TYPE: source

  postgres:
    container_name: sub2api-custom-postgres

  redis:
    container_name: sub2api-custom-redis
